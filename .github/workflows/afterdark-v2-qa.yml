name: After Dark V2 source and build QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'editorial.css'
      - 'editorial.js'
      - '.github/workflows/afterdark-v2-qa.yml'
  workflow_dispatch:
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check editorial.js
          node --check enquiry.js
          node --check scripts/build.mjs
      - name: Generate static pages
        run: node scripts/build.mjs
      - name: Assert hero provenance and routes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const home=fs.readFileSync('index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('src/build-manifest.json','utf8'));
          if(manifest.length!==19)throw new Error('Expected 19 generated static pages');
          if(!home.includes('garden-bride-hero.webp'))throw new Error('Production hero absent');
          const hero=home.match(/<section class="shell edit-hero v2-hero">[\s\S]*?<\/section>/)?.[0]||'';
          if(!hero.includes('Make moments')||hero.includes('yuki-11.webp'))throw new Error('Hero content mismatch');
          if(!home.includes('v2-optional-edit')||!home.includes('Start with the occasion.'))throw new Error('V2 homepage hierarchy incomplete');
          for(const page of manifest){if(!fs.existsSync(page.file))throw new Error('Missing route '+page.file);}
          console.log('Source/build checks passed. Browser visuals and enquiries require separate QA.');
          NODE
